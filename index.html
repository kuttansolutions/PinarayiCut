<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Triveni Nagar — KSEB Patrol — Old Jeep + No Party Office</title>
<style>
:root{
  --yellow:#ffd23f;
  --night:#04070f;
  --panel: rgba(8,12,22,.92);
  --line: rgba(255,210,63,.32);
}
*{ box-sizing:border-box; }
html,body{
  margin:0; height:100%; background:var(--night); overflow:hidden;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color:#e9e7df; overscroll-behavior:none;
}
#game{ display:block; position:absolute; inset:0; cursor:grab; touch-action:none; }
#game:active{ cursor:grabbing; }
.panel{
  position:absolute; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:18px 20px; box-shadow:0 14px 50px rgba(0,0,0,.65);
  z-index:30; backdrop-filter: blur(8px);
}
.hidden{ display:none !important; }
#screen{
  left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(420px,90vw); text-align:center; padding:20px;
}
h1{ font-size:28px; margin:0 0 4px; color:var(--yellow); letter-spacing:3px; line-height:1.1; }
h2{ font-size:10px; margin:0 0 14px; color:#6f8696; letter-spacing:2px; text-transform:uppercase; }
.kerala-badge{
  display:inline-block; background:linear-gradient(90deg,#ff9933,#ffffff,#138808);
  color:#000; font-weight:900; padding:2px 8px; border-radius:4px; font-size:9px; letter-spacing:1px; margin-bottom:10px;
}
button{
  font:inherit; font-size:13px; letter-spacing:1px; padding:10px 18px; margin:5px;
  cursor:pointer; background:#ffd23f; color:#0b0d12; border:0; border-radius:8px; font-weight:700;
  transition: transform .08s, filter .15s; touch-action:manipulation;
}
button:hover{ filter:brightness(1.08); }
button.ghost{ background:transparent; color:var(--yellow); border:1px solid rgba(255,210,63,.5); }
button:active{ transform:translateY(1px) scale(.98); }
#banner{
  position:absolute; left:50%; top:12px; transform:translate(-50%,-140%);
  background:rgba(150,12,12,.92); border:1px solid #ff5b4a; color:#fff; padding:8px 16px; border-radius:8px;
  font-size:12px; letter-spacing:.8px; z-index:25; transition:transform .25s ease, opacity .25s ease; opacity:0;
  white-space:nowrap; box-shadow:0 8px 30px rgba(0,0,0,.6); max-width:92vw; overflow:hidden; text-overflow:ellipsis;
}
#banner.show{ transform:translate(-50%,0); opacity:1; }
#banner.good{ background:rgba(14,110,60,.92); border-color:#7CFC00; }
#banner.shock{ background:rgba(180,160,20,.92); border-color:#ffeb3b; color:#000; }
#settingsPanel{ right:12px; top:12px; width:300px; font-size:12px; z-index:35; }
#settingsPanel h3{ margin:0 0 12px; color:var(--yellow); font-size:12px; letter-spacing:1px; }
.setting-row{ margin:12px 0; }
.setting-row label{ display:flex; justify-content:space-between; color:#bcd0de; margin-bottom:5px; font-size:11px; }
.setting-row input[type=range]{ width:100%; accent-color:var(--yellow); }
.setting-value{ color:var(--yellow); font-weight:700; }
.toggle-group{ display:flex; gap:6px; margin-top:6px; }
.toggle-group button{ flex:1; padding:8px 6px; font-size:11px; }
.toggle-group button.on{ background:var(--yellow); color:#000; }
#settingsBtn{
  position:absolute; left:12px; top:12px; z-index:20;
  background:rgba(8,12,22,.85); border:1px solid rgba(255,210,63,.28);
  color:var(--yellow); padding:7px 10px; border-radius:8px; font-size:11px; cursor:pointer;
}

/* === ANDROID — Dr Driving, horizontal, transparent wheel === */
#mobileControls{
  position:absolute; left:0; right:0; bottom:0; z-index:22; pointer-events:none;
  display:flex; justify-content:space-between; align-items:flex-end;
  padding:10px 12px 12px; box-sizing:border-box;
  height:150px;
}
#steerZone, #pedalZone{ pointer-events:auto; display:flex; align-items:center; gap:10px; }
#steerZone{ flex-direction:row; }
#steerWheel{
  width:110px; height:110px; border-radius:50%;
  background: transparent;
  border:8px solid rgba(255,210,63,.38);
  box-shadow:0 0 0 2px rgba(0,0,0,.5) inset, 0 4px 18px rgba(0,0,0,.5);
  position:relative; touch-action:none; user-select:none;
}
#steerWheel::after{
  content:''; position:absolute; inset:18px; border-radius:50%;
  border:1px solid rgba(255,210,63,.18); background:rgba(0,0,0,.18);
}
#steerKnob{
  width:16px; height:16px; border-radius:50%; background:var(--yellow);
  box-shadow:0 0 8px rgba(255,210,63,.9); position:absolute;
  left:50%; top:6px; transform:translateX(-50%);
  z-index:2;
}
#steerValue{ display:none; }
.steerBtns{ display:flex; gap:8px; }
.steerBtns.hidden{ display:none !important; }
.steerBtns button{
  width:52px; height:52px; padding:0; font-size:18px; background:rgba(8,12,22,.82);
  border:1px solid rgba(255,210,63,.32); color:var(--yellow); border-radius:12px;
}
.steerBtns button.active{ background:var(--yellow); color:#000; }
#pedalZone{ gap:10px; }
#pedalZone button{
  width:74px; height:74px; border-radius:16px; font-size:11px; line-height:1.1; font-weight:800;
  background: rgba(20,24,32,.85); border:2px solid rgba(255,210,63,.26);
  color:#dfe8ef; box-shadow:0 6px 18px rgba(0,0,0,.5); touch-action:none; user-select:none;
}
#pedalZone button.active{ background:var(--yellow); color:#000; border-color:var(--yellow); transform:scale(.96); }

/* Landscape enforcement */
#rotateOverlay{
  position:absolute; inset:0; z-index:100; background:var(--night);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--yellow); font-size:14px; letter-spacing:1px; text-align:center; padding:20px;
}
#rotateOverlay span{ font-size:42px; margin-bottom:12px; display:block; }
@media (orientation: landscape){
  #rotateOverlay{ display:none !important; }
}
@media (orientation: portrait){
  #mobileControls{ padding-bottom:28px; }
}
@media (max-width: 900px){
  #screen{ width:88vw; }
  #settingsPanel{ width:92vw; left:4vw; right:4vw; top:auto; bottom:10px; max-height:70vh; overflow:auto; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="banner"></div>
<button id="settingsBtn">⚙️</button>

<div id="screen" class="panel">
  <div class="kerala-badge">TRIVENI NAGAR</div>
  <h1>FUSE PATROL</h1>
  <h2>OLD MAHINDRA • PC + ANDROID</h2>
  <div id="screenBtns">
    <button id="btnStart">START</button>
    <button id="btnSettings" class="ghost">SETTINGS</button>
  </div>
</div>

<div id="settingsPanel" class="panel hidden">
  <h3>SETTINGS</h3>
  <div class="setting-row">
    <label>Control Type</label>
    <div class="toggle-group">
      <button data-ctrl="wheel" class="on">Steering Wheel</button>
      <button data-ctrl="buttons">Buttons</button>
    </div>
  </div>
  <div class="setting-row">
    <label>Sound</label>
    <div class="toggle-group">
      <button data-sound="on" class="on">ON</button>
      <button data-sound="off">OFF</button>
    </div>
  </div>
  <div class="setting-row">
    <label>Rotatability <span class="setting-value" id="steeringVal">1.0x</span></label>
    <input id="steeringSlider" type="range" min="0.5" max="2.5" step="0.1" value="1.0" />
    <div><span id="turnVal" style="color:#ffd23f;font-size:10px">2.6 / 47°</span></div>
  </div>
  <div class="setting-row">
    <label>Volume <span class="setting-value" id="volumeVal">85%</span></label>
    <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.85" />
  </div>
  <div class="setting-row">
    <button id="resetSteering" class="ghost" style="font-size:10px">Reset</button>
    <button id="btnCloseSettings" style="font-size:10px">CLOSE</button>
  </div>
</div>

<div id="mobileControls" class="hidden">
  <div id="steerZone">
    <div id="steerWheel"><div id="steerKnob"></div></div>
    <div id="steerBtns" class="steerBtns hidden">
      <button id="btnLeft">◀</button>
      <button id="btnRight">▶</button>
    </div>
  </div>
  <div id="pedalZone">
    <button id="btnAccel">GAS</button>
    <button id="btnBrake">BRAKE</button>
  </div>
</div>

<div id="rotateOverlay" class="hidden">
  <span>↻</span>
  Rotate phone to <b>landscape</b><br>
  <small>Horizontal = more view</small>
</div>

<script>
'use strict';
/* Triveni Nagar — KSEB Patrol — Single File + Android — No descriptions, Party Office, Smart Theft */
(function(){

const DEFAULTS = { LOW_SPEED_TURN: 2.6, MAX_STEER: 0.82 };
const CFG = {
  CELL:20, GRID_W:160, GRID_H:90,
  MAX_SPEED:360, ACCEL:280, BRAKE:480, FRICTION:88, REVERSE_MAX:-140,
  WHEELBASE:38, MAX_STEER:DEFAULTS.MAX_STEER, LOW_SPEED_TURN:DEFAULTS.LOW_SPEED_TURN,
  OFFROAD:0.70, HANDBRAKE:720,
  NIGHT_ALPHA:0.78, HEADLIGHT_RANGE:380, HEADLIGHT_HALF:0.58,
  SHIFT_LEN:300, BLACKOUT_FAIL:5, BLACKOUT_TIME:30, CATCH_SPEED:70, REPAIR_TIME:3.0, REPAIR_RANGE:76,
  MAX_THIEVES:8, MAX_CONCURRENT_THEFTS:2, THEFT_COOLDOWN:9
};
const CELL=CFG.CELL, GRID_W=CFG.GRID_W, GRID_H=CFG.GRID_H;
const WORLD_W=GRID_W*CELL, WORLD_H=GRID_H*CELL;
const TAU=Math.PI*2;
function mulberry32(a){return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
function dist(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy);}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=(rng()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

const L={ blocked:new Uint8Array(GRID_W*GRID_H), road:new Uint8Array(GRID_W*GRID_H), walk:new Uint8Array(GRID_W*GRID_H), water:new Uint8Array(GRID_W*GRID_H) };
const IX=(cx,cy)=>cy*GRID_W+cx;
const inGrid=(cx,cy)=>cx>=0&&cy>=0&&cx<GRID_W&&cy<GRID_H;
function cellFill(layer,x,y,w,h,v){for(let cy=y;cy<y+h;cy++)for(let cx=x;cx<x+w;cx++){if(inGrid(cx,cy))layer[IX(cx,cy)]=v;}}
function isBlocked(cx,cy){return !inGrid(cx,cy)?true:L.blocked[IX(cx,cy)]===1;}
function drivableAt(x,y){if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return false;return !isBlocked(Math.floor(x/CELL),Math.floor(y/CELL));}
function walkableAt(x,y){if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return false;return L.walk[IX(Math.floor(x/CELL),Math.floor(y/CELL))]===1;}
function roadAt(x,y){if(x<0||y<0||x>=WORLD_W||y>=WORLD_H)return false;return L.road[IX(Math.floor(x/CELL),Math.floor(y/CELL))]===1;}
function walkLine(ax,ay,bx,by){const d=dist(ax,ay,bx,by),steps=Math.max(1,Math.ceil(d/10));for(let i=0;i<=steps;i++){const t=i/steps;if(!walkableAt(ax+(bx-ax)*t,ay+(by-ay)*t))return false;}return true;}
function findCell(pred){for(let cy=0;cy<GRID_H;cy++)for(let cx=0;cx<GRID_W;cx++)if(pred(cx,cy))return[cx,cy];return null;}
function bfs(seed,passable,seen){const q=[seed[1]*GRID_W+seed[0]];seen[q[0]]=1;for(let h=0;h<q.length;h++){const i=q[h],cx=i%GRID_W,cy=(i-cx)/GRID_W;const nb=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];for(const[nx,ny]of nb){if(!inGrid(nx,ny))continue;const ni=IX(nx,ny);if(seen[ni]||!passable(nx,ny))continue;seen[ni]=1;q.push(ni);}}return seen;}

const POLE_NAMES=[
  'Triveni Nagar Junction',
  'Tippu Sulthan Nagar - 0.4km',
  'Sree Vishveshwara Temple - Yakkara - 0.6km',
  'Vinukuttan\'s House - 0.7km',
  'Kannadi Check Dam - 0.7km',
  'Riveira - 0.8km',
  'Haritha Nagar - 0.9km',
  'A.K.G. Nagar - 1km',
  'Nila Nagar - 1.1km',
  'Fort Colony - 2.2km',
  'Triveni Nagar Tea Shop',
  'Triveni Nagar Water Tank',
  'Triveni Nagar Paddy Corner',
  'Triveni Nagar Coconut Grove',
  'Triveni Nagar Schoolpadi',
  'Triveni Nagar Mosque Road'
];

let Hbands=[], Vbands=[], lanes=[], poles=[], houses=[], trees=[], poleConnections=[];

function generateWorld(seed){
  const rng=mulberry32(seed);
  L.blocked.fill(0);L.road.fill(0);L.walk.fill(0);L.water.fill(0);
  lanes=[];poles=[];houses=[];trees=[];poleConnections=[];
  Hbands=[{y:12,h:4},{y:40,h:5},{y:71,h:4}];
  Vbands=[{x:27,w:4},{x:75,w:5},{x:123,w:4}];
  for(const b of Hbands) cellFill(L.road,0,b.y,GRID_W,b.h,1);
  for(const b of Vbands) cellFill(L.road,b.x,0,b.w,GRID_H,1);
  const hGaps=gapsOf(Hbands,'y','h',GRID_H);
  const vGaps=gapsOf(Vbands,'x','w',GRID_W);
  for(const vg of vGaps)for(const hg of hGaps){
    const x0=vg.a+2,x1=vg.b-2,y0=hg.a+2,y1=hg.b-2;
    const bw=x1-x0,bh=y1-y0;
    if(bw<9||bh<8)continue;
    const kind=rng();
    if(kind<0.12){addPaddyField(rng,x0,y0,bw,bh);continue;}
    if(kind<0.20){addClump(rng,x0,y0,bw,bh,3);continue;}
    const hw=7,hh=5,gx=3,gy=3;
    const cols=Math.max(1,Math.floor((bw+gx)/(hw+gx)));
    const rows=Math.max(1,Math.floor((bh+gy)/(hh+gy)));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      if(rng()<0.18)continue;
      const x=x0+c*(hw+gx)+(rng()<0.4?1:0);
      const y=y0+r*(hh+gy)+(rng()<0.4?1:0);
      const w=hw+(rng()<0.35?2:0);
      if(x+w>x1+1||y+hh>y1+1)continue;
      cellFill(L.blocked,x,y,w,hh,1);
      houses.push({x,y,w,h:hh});
    }
    if(rng()<0.75)addClump(rng,x0,y0,bw,bh,1+((rng()*2)|0));
    if(rng()<0.32)addCompoundWall(rng,x0,y0,bw,bh);
  }
  carveKeralaLanes(rng,hGaps,vGaps);
  buildWalkLayer();
  pruneConnectivity();
  placePolesKerala(rng);
  generateTrees(rng);
  buildPoleConnections();
}
function gapsOf(bands,key,sizeKey,total){const out=[];let cur=1;for(const b of bands){const s=b[key];if(s-cur>=9)out.push({a:cur,b:s});cur=s+b[sizeKey];}if(total-cur>=9)out.push({a:cur,b:total});return out;}
function addPaddyField(rng,x0,y0,bw,bh){const cx=x0+bw/2,cy=y0+bh/2,rx=bw*0.42,ry=bh*0.42;for(let cyc=y0;cyc<y0+bh;cyc++)for(let cxc=x0;cxc<x0+bw;cxc++){const nx=(cxc+0.5-cx)/rx,ny=(cyc+0.5-cy)/ry;if(nx*nx+ny*ny<=1){L.water[IX(cxc,cyc)]=1;L.blocked[IX(cxc,cyc)]=1;}}for(let cyc=y0;cyc<y0+bh;cyc++)for(let cxc=x0;cxc<x0+bw;cxc++){const nx=(cxc+0.5-cx)/rx,ny=(cyc+0.5-cy)/ry;const d=nx*nx+ny*ny;if(d>0.78&&d<=1.1&&inGrid(cxc,cyc)){L.blocked[IX(cxc,cyc)]=0;L.walk[IX(cxc,cyc)]=1;}}}
function addClump(rng,x0,y0,bw,bh,count){for(let k=0;k<count;k++){const cx=x0+2+rng()*(bw-4),cy=y0+2+rng()*(bh-4),rx=1.6+rng()*2.4,ry=1.4+rng()*2.0;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const nx=(x-cx)/rx,ny=(y-cy)/ry;if(nx*nx+ny*ny<=1&&inGrid(x,y)&&!L.road[IX(x,y)])L.blocked[IX(x,y)]=1;}}}
function addCompoundWall(rng,x0,y0,bw,bh){const horiz=rng()<0.5;if(horiz){const y=y0-1,gateX=x0+Math.floor(bw/2);for(let x=x0-1;x<=x0+bw;x++){if(!inGrid(x,y))continue;L.blocked[IX(x,y)]=1;}for(let x=gateX;x<gateX+2;x++)if(inGrid(x,y)){L.blocked[IX(x,y)]=0;L.walk[IX(x,y)]=1;}}else{const x=x0-1,gateY=y0+Math.floor(bh/2);for(let y=y0-1;y<=y0+bh;y++){if(!inGrid(x,y))continue;L.blocked[IX(x,y)]=1;}for(let y=gateY;y<gateY+2;y++)if(inGrid(x,y)){L.blocked[IX(x,y)]=0;L.walk[IX(x,y)]=1;}}}
function carveKeralaLanes(rng,hGaps,vGaps){
  for(const hg of hGaps){const y0=hg.a+2,y1=hg.b-2;for(let tries=0;tries<8;tries++){const ly=y0+Math.floor(rng()*Math.max(1,y1-y0));if(ly<=y0||ly>=y1)continue;let clear=true;for(let x=0;x<GRID_W;x++)if(L.blocked[IX(x,ly)]&&!L.water[IX(x,ly)]){clear=false;break;}if(!clear)continue;for(let x=0;x<GRID_W;x++){if(L.road[IX(x,ly)])continue;L.blocked[IX(x,ly)]=1;L.walk[IX(x,ly)]=1;}lanes.push({cx0:0,cy0:ly,cx1:GRID_W-1,cy1:ly});break;}}
  for(const vg of vGaps){const x0=vg.a+2,x1=vg.b-2;for(let tries=0;tries<8;tries++){const lx=x0+Math.floor(rng()*Math.max(1,x1-x0));if(lx<=x0||lx>=x1)continue;let clear=true;for(let y=0;y<GRID_H;y++)if(L.blocked[IX(lx,y)]&&!L.water[IX(lx,y)]){clear=false;break;}if(!clear)continue;for(let y=0;y<GRID_H;y++){if(L.road[IX(lx,y)])continue;L.blocked[IX(lx,y)]=1;L.walk[IX(lx,y)]=1;}lanes.push({cx0:lx,cy0:0,cx1:lx,cy1:GRID_H-1});break;}}
  for(let k=0;k<22;k++){const hx=2+(rng()*(GRID_W-4))|0,hy=2+(rng()*(GRID_H-4))|0;if(L.road[IX(hx,hy)]||!L.blocked[IX(hx,hy)])continue;let best=null,bd=999;for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++)if(L.road[IX(x,y)]){const d=Math.hypot(x-hx,y-hy);if(d<bd){bd=d;best=[x,y];}}if(!best||bd>18)continue;const[rx,ry]=best;const steps=Math.max(Math.abs(rx-hx),Math.abs(ry-hy));for(let i=0;i<=steps;i++){const t=i/steps;const cx=Math.round(lerp(hx,rx,t)),cy=Math.round(lerp(hy,ry,t));if(inGrid(cx,cy)&&!L.road[IX(cx,cy)]){L.blocked[IX(cx,cy)]=1;L.walk[IX(cx,cy)]=1;}}}
}
function buildWalkLayer(){for(let i=0;i<L.walk.length;i++)if(L.walk[i]===0&&L.blocked[i]===0)L.walk[i]=1;}
function pruneConnectivity(){const seed=findCell((cx,cy)=>L.road[IX(cx,cy)]===1)||[1,1];const seenA=new Uint8Array(GRID_W*GRID_H);bfs(seed,(cx,cy)=>!isBlocked(cx,cy),seenA);for(let i=0;i<seenA.length;i++)if(!seenA[i]&&!L.blocked[i]){L.blocked[i]=1;L.walk[i]=0;}const seenB=new Uint8Array(GRID_W*GRID_H);bfs(seed,(cx,cy)=>L.walk[IX(cx,cy)]===1,seenB);for(let i=0;i<seenB.length;i++)if(!seenB[i]&&L.walk[i])L.walk[i]=0;}
function placePolesKerala(rng){
  const names=shuffle(POLE_NAMES.slice(),rng);
  const edges=[];
  for(let cy=0;cy<GRID_H;cy++)for(let cx=0;cx<GRID_W;cx++){
    if(!L.road[IX(cx,cy)])continue;
    const nb=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];
    if(nb.some(([nx,ny])=>!inGrid(nx,ny)||L.road[IX(nx,ny)]===0))edges.push([cx,cy]);
  }
  shuffle(edges,rng);
  for(const[cx,cy]of edges){
    const x=cx*CELL+CELL/2+(rng()-0.5)*8,y=cy*CELL+CELL/2+(rng()-0.5)*8;
    if(poles.some(p=>dist(p.x,p.y,x,y)<300))continue;
    poles.push({id:'POST-'+String(poles.length+1).padStart(2,'0'),name:names[poles.length%names.length],x,y,radius:155+rng()*75,type:rng()<0.68?'warm':'cool',working:true,darkSince:0,repair:0,blink:rng()*TAU,hasTransformer:rng()<0.22});
    if(poles.length>=16)break;
  }
}

const jeep={x:0,y:0,heading:0,speed:0,steerAngle:0,steerVis:0,headlights:true,repairing:null,repairT:0,bumpCd:0,tilt:0};
function resetJeep(){const b=Hbands[1];jeep.x=60;jeep.y=(b.y+b.h/2)*CELL;jeep.heading=0;jeep.speed=0;jeep.steerAngle=0;jeep.steerVis=0;jeep.headlights=true;jeep.repairing=null;jeep.repairT=0;}
function getJeepCorners(x,y,heading){const c=Math.cos(heading),s=Math.sin(heading);const hl=26,hw=13;const pts=[[hl,hw],[hl,-hw],[-hl,hw],[-hl,-hw],[0,0],[hl+2,0]];return pts.map(([a,b])=>[x+c*a-s*b,y+s*a+c*b]);}
function canPlace(x,y,heading){const h=heading!==undefined?heading:jeep.heading;const corners=getJeepCorners(x,y,h);for(const[px,py]of corners){if(!drivableAt(px,py))return false;}return true;}
let mobileSteer=0,mobileAccel=0,mobileBrake=0;
function updateJeep(dt){
  const keySteer=(keys.left?-1:0)+(keys.right?1:0);
  const steerIn=Math.abs(mobileSteer)>0.06?mobileSteer:keySteer;
  const targetSteer=steerIn*CFG.MAX_STEER;
  jeep.steerAngle=lerp(jeep.steerAngle,targetSteer,1-Math.exp(-6.5*dt));
  jeep.steerVis=lerp(jeep.steerVis,steerIn,1-Math.exp(-9*dt));
  const keyAccel=keys.up?1:0, keyBrake=keys.down?1:0;
  const tx=(mobileAccel>0.05?mobileAccel:keyAccel);
  const br=(mobileBrake>0.05?mobileBrake:keyBrake);
  const onRoad=roadAt(jeep.x,jeep.y);
  if(tx>0.01)jeep.speed+=CFG.ACCEL*tx*dt;
  if(br>0.01)jeep.speed-=CFG.BRAKE*br*dt;
  if(keys.space)jeep.speed-=Math.sign(jeep.speed)*CFG.HANDBRAKE*dt;
  const fr=CFG.FRICTION*dt*(keys.space?0.35:1)*(onRoad?1:1.45);
  jeep.speed-=Math.sign(jeep.speed)*fr;
  if(Math.abs(jeep.speed)<4&&tx<0.01&&br<0.01)jeep.speed=0;
  const maxF=onRoad?CFG.MAX_SPEED:CFG.MAX_SPEED*CFG.OFFROAD;
  jeep.speed=clamp(jeep.speed,CFG.REVERSE_MAX,maxF);
  if(Math.abs(jeep.speed)>8){jeep.heading+=(jeep.speed/CFG.WHEELBASE)*Math.tan(jeep.steerAngle)*dt;}
  else{const pivotFactor=1.0+(8-Math.abs(jeep.speed))/8*0.6;jeep.heading+=steerIn*CFG.LOW_SPEED_TURN*pivotFactor*dt;}
  if(!onRoad&&Math.abs(jeep.speed)>20)jeep.heading+=Math.sin(Game.t*13+jeep.x*0.01)*0.18*dt*(Math.abs(jeep.speed)/CFG.MAX_SPEED);
  jeep.tilt=lerp(jeep.tilt,steerIn*clamp(Math.abs(jeep.speed)/120,0,1)*0.18,1-Math.exp(-7*dt));
  const nx=jeep.x+Math.cos(jeep.heading)*jeep.speed*dt;
  const ny=jeep.y+Math.sin(jeep.heading)*jeep.speed*dt;
  let hit=false;
  if(canPlace(nx,jeep.y))jeep.x=nx;else{hit=true;jeep.speed*=0.4;}
  if(canPlace(jeep.x,ny))jeep.y=ny;else{hit=true;jeep.speed*=0.4;}
  if(hit&&Math.abs(jeep.speed)>30&&jeep.bumpCd<=0){jeep.bumpCd=0.35;Game.shake=Math.min(12,Math.abs(jeep.speed)/26);Sfx.thud();addParticles(jeep.x-Math.cos(jeep.heading)*26,jeep.y-Math.sin(jeep.heading)*26,10,'#c9c2a8');}
  if(hit)jeep.speed*=-0.18;
  jeep.bumpCd-=dt;
  if(Math.abs(jeep.speed)>180&&Math.abs(steerIn)>0.2&&Game.t-lastSkid>0.06){lastSkid=Game.t;marks.push({x:jeep.x,y:jeep.y,a:jeep.heading,life:6.5});if(marks.length>160)marks.shift();if(!onRoad&&Math.random()<0.5)addParticles(jeep.x,jeep.y,2,'#5b5340');}
  Sfx.engine(clamp(Math.abs(jeep.speed)/CFG.MAX_SPEED,0,1.2),tx>0.1,Game.mode==='playing'&&!Game.paused);
  for(const t of thieves){
    if(t.dead)continue;
    if(dist(t.x,t.y,jeep.x,jeep.y)<26&&Math.abs(jeep.speed)>CFG.CATCH_SPEED){
      t.dead=true;Game.caught++;Game.graceT=18;
      Game.deadThieves.push({x:t.x,y:t.y,life:2.2});
      Sfx.thud();playCaughtSound();Sfx.tone(880,0.18,'triangle',0.14,1320);
      const gid=t.groupId;
      if(gid){for(const ot of thieves){if(!ot.dead&&ot.groupId===gid&&dist(ot.x,ot.y,t.x,t.y)<90){ot.dead=true;Game.caught++;Game.deadThieves.push({x:ot.x,y:ot.y,life:2.2});}}}
      alertPush('CAUGHT','good');Game.shake=7;addParticles(t.x,t.y,18,'#ffe07a');addShockBurst(t.x,t.y,14);
    }
  }
}

const TH={WANDER:0,TARGET:1,STEAL:2,FLEE:3,HIDE:4};
let thieves=[],thiefIdSeq=1,groups=[],groupIdSeq=1;

function spawnThiefGroup(){
  const size=Math.random()<0.52?2:3;
  if(thieves.length>=CFG.MAX_THIEVES)return false;
  for(let attempt=0;attempt<90;attempt++){
    const cx=2+((Math.random()*(GRID_W-4))|0), cy=2+((Math.random()*(GRID_H-4))|0);
    const baseX=cx*CELL+CELL/2, baseY=cy*CELL+CELL/2;
    if(!walkableAt(baseX,baseY))continue;
    if(dist(baseX,baseY,jeep.x,jeep.y)<640)continue;
    const gid=groupIdSeq++;
    const group={id:gid,members:[],targetPole:null,state:TH.WANDER};
    const members=[];
    const usedPoles=groups.map(g=>g.targetPole).filter(Boolean).map(p=>p.id);
    const targetPole=pickUniformPole(usedPoles);
    for(let i=0;i<size;i++){
      const ang=(i/size)*TAU+(Math.random()-0.5)*0.6;
      const r=14+Math.random()*22;
      let x=baseX+Math.cos(ang)*r, y=baseY+Math.sin(ang)*r;
      if(!walkableAt(x,y)){x=baseX;y=baseY;}
      const t={id:thiefIdSeq++,groupId:gid,x,y,tx:baseX,ty:baseY,state:TH.WANDER,timer:0.4+Math.random()*0.8,speed:0,dir:Math.random()*TAU,anim:Math.random()*10,pole:targetPole,progress:0,spotted:0,dead:false,offsetAng:ang,offsetDist:r,isLeader:i===0,lastShock:0,shockT:0,hasShouted:false,lastShout:0};
      if(targetPole){t.state=TH.TARGET;t.tx=targetPole.x;t.ty=targetPole.y;}
      thieves.push(t);members.push(t);
    }
    group.members=members;group.targetPole=targetPole;group.state=targetPole?TH.TARGET:TH.WANDER;
    groups.push(group);
    return true;
  }
  return false;
}
function pickUniformPole(excludeIds){
  const lit=poles.filter(p=>p.working && !excludeIds.includes(p.id));
  if(!lit.length)return null;
  const otherTargets=groups.map(g=>g.targetPole).filter(Boolean);
  lit.sort((a,b)=>{
    let scoreA=0, scoreB=0;
    for(const ot of otherTargets){
      scoreA-= Math.max(0, 500-dist(a.x,a.y,ot.x,ot.y));
      scoreB-= Math.max(0, 500-dist(b.x,b.y,ot.x,ot.y));
    }
    // also spread from jeep a bit
    scoreA+= dist(a.x,a.y,jeep.x,jeep.y)*0.15;
    scoreB+= dist(b.x,b.y,jeep.x,jeep.y)*0.15;
    return scoreB-scoreA;
  });

function pickWanderTarget(t){
  for(let i=0;i<28;i++){const ang=Math.random()*TAU,r=240+Math.random()*520;const x=clamp(t.x+Math.cos(ang)*r,40,WORLD_W-40),y=clamp(t.y+Math.sin(ang)*r,40,WORLD_H-40);if(walkableAt(x,y)&&walkLine(t.x,t.y,x,y)){t.tx=x;t.ty=y;return true;}}
  for(let i=0;i<16;i++){const ang=Math.random()*TAU,x=t.x+Math.cos(ang)*40,y=t.y+Math.sin(ang)*40;if(walkableAt(x,y)){t.tx=x;t.ty=y;return true;}}
  return false;
}
function moveThief(t,dt,speed){
  let sepX=0,sepY=0;
  for(const ot of thieves){if(ot===t||ot.dead)continue;const d=dist(t.x,t.y,ot.x,ot.y);if(d<22&&d>0.1){sepX+=(t.x-ot.x)/d*(22-d)*0.5;sepY+=(t.y-ot.y)/d*(22-d)*0.5;}}
  const dx=t.tx-t.x+sepX*12,dy=t.ty-t.y+sepY*12,d=Math.hypot(dx,dy);
  if(d<6)return true;
  const ux=dx/d,uy=dy/d;
  const nx=t.x+ux*speed*dt,ny=t.y+uy*speed*dt;
  let moved=false;
  if(walkableAt(nx,t.y)){t.x=nx;moved=true;}
  if(walkableAt(t.x,ny)){t.y=ny;moved=true;}
  t.dir=Math.atan2(uy,ux);
  if(!moved){if(walkableAt(t.x+(-uy)*speed*dt,t.y+ux*speed*dt)){t.x+=-uy*speed*dt;t.y+=ux*speed*dt;}}
  t.anim+=dt*8*(speed/55);
  return false;
}
function thiefSpottedByJeep(t){
  const d=dist(t.x,t.y,jeep.x,jeep.y);
  if(d<110)return true;
  if(!jeep.headlights)return false;
  if(d>CFG.HEADLIGHT_RANGE)return false;
  const ang=Math.atan2(t.y-jeep.y,t.x-jeep.x);
  let diff=Math.abs(((ang-jeep.heading+Math.PI*3)%TAU)-Math.PI);
  return diff<CFG.HEADLIGHT_HALF+0.08;
}
function updateThieves(dt){
  // count active thefts
  let activeSteals=0;
  for(const t of thieves){if(!t.dead&&t.state===TH.STEAL)activeSteals++;}
  Game.activeThefts=activeSteals;

  for(const g of groups){
    if(g.members.every(m=>m.dead))continue;
    let anySpotted=false;
    for(const m of g.members){if(!m.dead&&thiefSpottedByJeep(m)){anySpotted=true;
      // whoareyou sound only near post
      if(m.pole && dist(m.x,m.y,m.pole.x,m.pole.y)<75 && !m.hasShouted && Game.t-m.lastShout>6){
        m.hasShouted=true; m.lastShout=Game.t; playWhoAreYou();
      }
    }}
    if(anySpotted){
      g.state=TH.FLEE;
      for(const m of g.members){if(!m.dead){m.state=TH.FLEE;m.timer=5+Math.random()*2;m.progress=0;m.pole=null;m.shockT=0;}}
      g.targetPole=null;
    }
  }
  for(const g of groups){
    if(g.members.every(m=>m.dead))continue;
    if(g.state===TH.WANDER&&Game.graceT<=0&&Game.shift>6){
      if(Game.activeThefts>=CFG.MAX_CONCURRENT_THEFTS)continue;
      if(Game.t-Game.lastTheftTime<CFG.THEFT_COOLDOWN && Math.random()<0.85)continue;

        const p=pickUniformPole(groups.map(gr=>gr.targetPole).filter(Boolean).map(pp=>pp.id));
        if(p){g.targetPole=p;g.state=TH.TARGET;Game.lastTheftTime=Game.t;for(const m of g.members){if(!m.dead){m.pole=p;m.state=TH.TARGET;m.tx=p.x;m.ty=p.y;m.hasShouted=false;}}}
      }
    }
  }
  for(const t of thieves){
    if(t.dead)continue;
    const g=groups.find(gr=>gr.id===t.groupId);
    const leader=g?g.members.find(m=>m.isLeader&&!m.dead)||g.members.find(m=>!m.dead):null;
    const isLeader=leader===t;
    if(!isLeader&&g&&leader){
      if(g.state===TH.FLEE){t.tx=leader.tx;t.ty=leader.ty;moveThief(t,dt,68);continue;}
      if(g.state===TH.TARGET&&g.targetPole){
        const idx=g.members.indexOf(t);
        const ang=(idx/g.members.length)*TAU+Game.t*0.25;
        const r=22+idx*6;
        t.tx=g.targetPole.x+Math.cos(ang)*r;
        t.ty=g.targetPole.y+Math.sin(ang)*r;
        if(dist(t.x,t.y,g.targetPole.x,g.targetPole.y)<44)t.state=TH.STEAL;
      }
      if(g.state===TH.WANDER){t.tx=leader.x+Math.cos(leader.dir+t.offsetAng)*(t.offsetDist+10)+(Math.random()-0.5)*18;t.ty=leader.y+Math.sin(leader.dir+t.offsetAng)*(t.offsetDist+10)+(Math.random()-0.5)*18;}
    }
    switch(t.state){
      case TH.WANDER:
        t.timer-=dt;
        if(isLeader&&t.timer<=0){t.timer=0.7+Math.random()*1.0;pickWanderTarget(t);if(g)g.targetPole=null;}
        moveThief(t,dt,48);break;
      case TH.TARGET:
        if(!t.pole||!t.pole.working){t.state=TH.WANDER;t.timer=0.4;if(g){g.state=TH.WANDER;g.targetPole=null;}break;}
        t.tx=t.pole.x;t.ty=t.pole.y;
        if(moveThief(t,dt,60)){t.state=TH.STEAL;t.progress=0;t.lastShock=0;}
        if(isLeader&&Math.random()<0.0015){t.state=TH.WANDER;t.timer=0.5;if(g){g.state=TH.WANDER;}}
        break;
      case TH.STEAL:
        let numAtPole=0;for(const ot of thieves){if(!ot.dead&&ot.pole===t.pole&&dist(ot.x,ot.y,t.pole.x,t.pole.y)<52)numAtPole++;}
        const stealSpeed=Math.max(1,numAtPole*0.85);
        t.progress+=dt/2.6*stealSpeed;
        t.shockT-=dt;
        if(Game.t-t.lastShock>0.18+Math.random()*0.25){
          t.lastShock=Game.t;t.shockT=0.22;
          addShockLine(t.pole.x,t.pole.y,t.x,t.y);
          addShockBurst(t.x,t.y,6);addShockBurst(t.pole.x,t.pole.y,5);
          if(Math.random()<0.55){if(Settings.soundOn)Sfx.zap();Game.shake=Math.max(Game.shake,2.5);}
          t.x+=(Math.random()-0.5)*8;t.y+=(Math.random()-0.5)*8;
        }
        t.tx=t.pole.x+Math.cos(Game.t*2+t.id)*8;
        t.ty=t.pole.y+Math.sin(Game.t*2.2+t.id)*8;
        moveThief(t,dt,18);
        if(t.progress>=1)finishSteal(t);
        break;
      case TH.FLEE:
        t.timer-=dt;
        {const ax=Math.atan2(t.y-jeep.y,t.x-jeep.x)+(Math.random()-0.5)*0.5;t.tx=clamp(t.x+Math.cos(ax)*220,20,WORLD_W-20);t.ty=clamp(t.y+Math.sin(ax)*220,20,WORLD_H-20);if(!walkLine(t.x,t.y,t.tx,t.ty))pickWanderTarget(t);}
        moveThief(t,dt,74);
        if(t.timer<=0){t.state=TH.HIDE;t.timer=1.2+Math.random()*1.2;if(g&&isLeader)g.state=TH.HIDE;}
        break;
      case TH.HIDE:
        t.timer-=dt;
        if(t.timer<=0){t.state=TH.WANDER;t.timer=0.5;if(g&&isLeader)g.state=TH.WANDER;}
        else{if(isLeader)moveThief(t,dt,42);}
        break;
    }
  }
  thieves=thieves.filter(t=>!t.dead);
  groups.forEach(g=>{g.members=g.members.filter(m=>!m.dead);});
  groups=groups.filter(g=>g.members.length>0);
  Game.graceT=Math.max(0,Game.graceT-dt);
  const wantGroups=Math.min(3,1+Math.floor(Game.shift/75));
  let attempts=0;
  while(groups.length<wantGroups&&thieves.length<CFG.MAX_THIEVES&&attempts<10){
    const ok=spawnThiefGroup();attempts++;if(!ok)break;
  }
}
function finishSteal(t){

}

function update(dt){

function updateRepair(dt){

function drawThiefKerala(t){
  const bob=Math.sin(t.anim)*1.8;const isShocked=t.shockT>0;
  ctx.save();ctx.translate(t.x,t.y+bob);if(isShocked)ctx.translate((Math.random()-0.5)*4,(Math.random()-0.5)*4);ctx.rotate(t.dir+Math.PI/2);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(1,10,11,6,0,0,TAU);ctx.fill();
  ctx.fillStyle=isShocked?'#fff8d0':'#f7f1de';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(6,0);ctx.lineTo(7,14);ctx.lineTo(-7,14);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d4af37';ctx.fillRect(-7,12,14,2.2);
  ctx.fillStyle=isShocked?'#ff6b6b':'#c1272d';ctx.beginPath();ctx.moveTo(-6.5,-8);ctx.lineTo(6.5,-8);ctx.lineTo(6,1);ctx.lineTo(-6,1);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8b78a';ctx.beginPath();ctx.arc(0,-11,4.6,0,TAU);ctx.fill();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(0,-13.5,4.8,Math.PI,TAU);ctx.fill();
  if(t.state===TH.STEAL){ctx.strokeStyle=isShocked?'#ffeb3b':'#8f97a3';ctx.lineWidth=isShocked?3:2.3;const s=Math.sin(Game.t*20+t.id)*3;ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(16,4+s);ctx.stroke();ctx.fillStyle=isShocked?'#fff':(Math.random()<0.6?'#ffe07a':'#ff9a3c');ctx.beginPath();ctx.arc(17,5+s,isShocked?3.5:2.3,0,TAU);ctx.fill();}
  ctx.restore();
  if(isShocked){ctx.strokeStyle='rgba(255,235,59,.85)';ctx.lineWidth=1.2;ctx.beginPath();for(let k=0;k<3;k++){const ang=Math.random()*TAU;ctx.moveTo(t.x,t.y-6);ctx.lineTo(t.x+Math.cos(ang)*(10+Math.random()*10),t.y-6+Math.sin(ang)*(10+Math.random()*10));}ctx.stroke();}
  if(t.state===TH.STEAL){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(t.x-18,t.y-28,36,5);ctx.fillStyle=t.progress>0.6?'#ff8a3c':'#ffd23f';ctx.fillRect(t.x-18,t.y-28,36*t.progress,5);}
}
function drawMahindraJeep(){
  ctx.save();ctx.translate(jeep.x,jeep.y);ctx.rotate(jeep.heading);ctx.rotate(jeep.tilt*0.25);
  ctx.fillStyle='rgba(0,0,0,.52)';ctx.beginPath();ctx.ellipse(3,5,31,16,0,0,TAU);ctx.fill();
  function drawWheel(x,y,steered){
    ctx.save();ctx.translate(x,y);if(steered)ctx.rotate(jeep.steerAngle*0.85);
    ctx.fillStyle='#101010';ctx.fillRect(-6.5,-3.5,13,7);
    ctx.fillStyle='#2a2a2a';ctx.fillRect(-5,-2.5,10,5);
    ctx.fillStyle='#444';ctx.fillRect(-1.5,-2,3,4);
    ctx.strokeStyle='#222';ctx.lineWidth=0.8;
    for(let i=-4;i<=4;i+=2){ctx.beginPath();ctx.moveTo(i,-3);ctx.lineTo(i,3);ctx.stroke();}
    ctx.restore();
  }
  drawWheel(18,13,true);drawWheel(18,-13,true);drawWheel(-16,13,false);drawWheel(-16,-13,false);
  ctx.fillStyle='#2a2e33';ctx.fillRect(-28,-14,54,28);
  ctx.fillStyle='#d8d2bd';ctx.beginPath();ctx.moveTo(-24,-11);ctx.lineTo(20,-11);ctx.lineTo(24,-8);ctx.lineTo(24,8);ctx.lineTo(20,11);ctx.lineTo(-24,11);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c9c3ad';ctx.fillRect(6,-9,16,18);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(8,-9);ctx.lineTo(8,9);ctx.moveTo(14,-9);ctx.lineTo(14,9);ctx.stroke();
  ctx.fillStyle='#3a3d42';ctx.fillRect(23,-7.5,2.5,15);ctx.fillStyle='#d8d2bd';for(let i=-6;i<=6;i+=2.4){ctx.fillRect(22.5,i-0.6,1.8,1.2);}
  const hlOn=jeep.headlights;ctx.fillStyle=hlOn?'#fff6cf':'#5a5a54';ctx.beginPath();ctx.arc(22.5,-7,3.2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(22.5,7,3.2,0,TAU);ctx.fill();
  if(hlOn){ctx.fillStyle='rgba(255,245,180,0.65)';ctx.beginPath();ctx.arc(22.5,-7,5,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(22.5,7,5,0,TAU);ctx.fill();}
  ctx.strokeStyle='#2a2e33';ctx.lineWidth=1;ctx.beginPath();ctx.arc(22.5,-7,3.2,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(22.5,7,3.2,0,TAU);ctx.stroke();
  ctx.fillStyle='#2a2e33';ctx.fillRect(4,-11.5,2,23);ctx.fillStyle='rgba(120,170,200,.55)';ctx.fillRect(4.5,-10,1.2,20);
  ctx.strokeStyle='#2a2e33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-4,-11);ctx.lineTo(-4,11);ctx.stroke();ctx.beginPath();ctx.moveTo(-12,-11);ctx.lineTo(-12,11);ctx.stroke();ctx.beginPath();ctx.moveTo(-4,-9);ctx.lineTo(-12,-9);ctx.moveTo(-4,9);ctx.lineTo(-12,9);ctx.stroke();
  ctx.fillStyle='#5a4a3a';ctx.fillRect(-2,-8,8,6);ctx.fillRect(-2,2,8,6);
  ctx.strokeStyle='#1e1e1e';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(3,-5,3,0,TAU);ctx.stroke();ctx.fillStyle='#1e1e1e';ctx.beginPath();ctx.arc(3,-5,0.8,0,TAU);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-25,0,7,0,TAU);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.arc(-25,0,4.5,0,TAU);ctx.fill();ctx.fillStyle='#777';ctx.beginPath();ctx.arc(-25,0,1.8,0,TAU);ctx.fill();
  ctx.fillStyle='#2a2e33';ctx.fillRect(5,-12.5,2,1.5);ctx.fillRect(5,11,2,1.5);
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-14,-11);ctx.lineTo(-14,11);ctx.stroke();
  if(keys.down||jeep.speed<-12||mobileBrake>0.2){ctx.fillStyle='#ff2a1a';ctx.beginPath();ctx.arc(-26,-7,2.5,0,TAU);ctx.arc(-26,7,2.5,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,50,30,.4)';ctx.beginPath();ctx.arc(-26,-7,5,0,TAU);ctx.arc(-26,7,5,0,TAU);ctx.fill();}
  ctx.fillStyle='#ffd23f';ctx.fillRect(-27,-3,2.2,6);ctx.fillStyle='#000';ctx.font='5px monospace';ctx.textAlign='center';ctx.save();ctx.rotate(-Math.PI/2);ctx.fillText('KL',-0,26.5);ctx.restore();
  ctx.restore();
  if(jeep.repairing){const p=jeep.repairing,k=Math.sin(Game.t*18)*1.5;ctx.fillStyle='#1d3a5a';ctx.beginPath();ctx.arc(p.x-15,p.y+6+k,6.5,0,TAU);ctx.fill();ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(p.x-15,p.y-1.5+k,4.2,0,TAU);ctx.fill();ctx.fillStyle='#2a5a8a';ctx.fillRect(p.x-18,p.y+2+k,6,3);}
  // KSEB light above jeep — small beacon
  ctx.save();ctx.translate(jeep.x,jeep.y-18);ctx.rotate(jeep.heading);
  ctx.fillStyle='rgba(255,210,63,.85)';ctx.beginPath();ctx.arc(0,0,3.5,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,210,63,.25)';ctx.beginPath();ctx.arc(0,0,8,0,TAU);ctx.fill();
  ctx.restore();
}
function drawParticles(){
  for(const m of marks){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.a);ctx.fillStyle='rgba(10,10,12,'+clamp(m.life/6.5,0,0.45)+')';ctx.fillRect(-20,-13,9,3.5);ctx.fillRect(-20,9.5,9,3.5);ctx.restore();}
  for(const p of particles){ctx.globalAlpha=clamp(p.life*1.8,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  for(const s of shockParticles){ctx.globalAlpha=clamp(s.life*4,0,1);ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();ctx.globalAlpha=1;}
  for(const sl of shockLines){ctx.globalAlpha=clamp(sl.life*6,0,1);ctx.strokeStyle=Math.random()<0.5?'#ffeb3b':'#4fc3f7';ctx.lineWidth=1.5+Math.random()*1.2;ctx.beginPath();const mx=(sl.x1+sl.x2)/2,my=(sl.y1+sl.y2)/2;const off=(Math.random()-0.5)*12;ctx.moveTo(sl.x1,sl.y1);ctx.lineTo(mx+off,my+off);ctx.lineTo(sl.x2,sl.y2);ctx.stroke();ctx.globalAlpha=1;}
  for(const d of Game.deadThieves){ctx.globalAlpha=clamp(d.life/2.2,0,1);ctx.fillStyle='#ffe07a';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('+CAUGHT',d.x,d.y-14);ctx.globalAlpha=1;}
}
function drawHUD(){
  const {w,h}=view;
  const mins=21*60+(Game.shift/CFG.SHIFT_LEN)*540;
  const hh=String(Math.floor(mins/60)%24).padStart(2,'0'),mm=String(Math.floor(mins%60)).padStart(2,'0');
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillStyle='rgba(4,7,15,.72)';ctx.beginPath();ctx.roundRect(12,12,180,46,10);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.font='bold 18px monospace';ctx.fillText(hh+':'+mm,16,16);
  ctx.fillStyle='#9fb4c7';ctx.font='10px monospace';ctx.fillText('UP '+Game.uptime.toFixed(0)+'% C:'+Game.caught,16,36);
  // speed
  ctx.fillStyle='rgba(4,7,15,.72)';ctx.beginPath();ctx.roundRect(12,h-36,120,24,8);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.font='bold 14px monospace';ctx.fillText(Math.round(Math.abs(jeep.speed)*0.55)+' km/h',18,h-28);
  // compass to dark pole
  let nearest=null,best=1e9;for(const p of poles){if(p.working)continue;const d=dist(p.x,p.y,jeep.x,jeep.y);if(d<best){best=d;nearest=p;}}
  if(nearest){const ang=Math.atan2(nearest.y-jeep.y,nearest.x-jeep.x);ctx.save();ctx.translate(w/2,h-24);ctx.rotate(ang);ctx.fillStyle='rgba(255,70,60,.9)';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(4,-8);ctx.lineTo(4,8);ctx.closePath();ctx.fill();ctx.restore();}
  drawMinimap();
  if(Game.flash>0.01){ctx.fillStyle='rgba(255,40,30,'+(Game.flash*0.26)+')';ctx.fillRect(0,0,w,h);}
}
function drawMinimap(){
  if(!bgThumb)return;
  const mw=160,mh=Math.round(mw*WORLD_H/WORLD_W),mx=view.w-mw-10,my=10;
  ctx.globalAlpha=0.9;ctx.drawImage(bgThumb,mx,my,mw,mh);ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,210,63,.4)';ctx.lineWidth=1;ctx.strokeRect(mx+.5,my+.5,mw,mh);
  const sx=mw/WORLD_W,sy=mh/WORLD_H;
  for(const p of poles){const x=mx+p.x*sx,y=my+p.y*sy;if(p.working){ctx.fillStyle='rgba(124,252,0,.85)';ctx.beginPath();ctx.arc(x,y,1.6,0,TAU);ctx.fill();}else{ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.arc(x,y,3,0,TAU);ctx.fill();}}
  for(const t of thieves){ctx.fillStyle='rgba(255,120,120,.7)';ctx.beginPath();ctx.arc(mx+t.x*sx,my+t.y*sy,1.8,0,TAU);ctx.fill();}
  const jx=mx+jeep.x*sx,jy=my+jeep.y*sy;ctx.save();ctx.translate(jx,jy);ctx.rotate(jeep.heading);ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-3);ctx.lineTo(-4,3);ctx.closePath();ctx.fill();ctx.restore();
}
function render(){
  const camX=Math.round(cam.x+(Math.random()-0.5)*Game.shake);
  const camY=Math.round(cam.y+(Math.random()-0.5)*Game.shake);
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.fillStyle='#0a1a12';ctx.fillRect(0,0,view.w,view.h);
  if(bg)ctx.drawImage(bg,camX,camY,view.w,view.h,0,0,view.w,view.h);
  ctx.save();ctx.translate(-camX,-camY);
  drawLightPools();drawWires();
  for(const p of poles)drawElectricPost(p);
  for(const t of thieves)drawThiefKerala(t);
  drawMahindraJeep();
  drawParticles();
  ctx.restore();
  drawLightMask(camX,camY);
  if(Game.mode==='title'){ctx.fillStyle='rgba(4,7,15,.38)';ctx.fillRect(0,0,view.w,view.h);return;}
  drawHUD();
}

const Settings={steering:1.0,volume:0.85,controlType:'wheel',soundOn:true};
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('triveni_settings_v2')||'{}');
    if(s.steering)Settings.steering=clamp(parseFloat(s.steering),0.5,2.5);
    if(s.volume!==undefined)Settings.volume=clamp(parseFloat(s.volume),0,1);
    if(s.controlType)Settings.controlType=s.controlType;
    if(s.soundOn!==undefined)Settings.soundOn=!!s.soundOn;
  }catch(e){}
}
function saveSettings(){try{localStorage.setItem('triveni_settings_v2',JSON.stringify(Settings));}catch(e){}}
function applySettings(){
  const sens=Settings.steering;
  CFG.LOW_SPEED_TURN=DEFAULTS.LOW_SPEED_TURN*sens;
  CFG.MAX_STEER=clamp(DEFAULTS.MAX_STEER*(0.55+0.65*sens),0.35,1.25);
  if(caughtAudio)caughtAudio.volume=Settings.volume;
  if(whoAreYouAudio)whoAreYouAudio.volume=Settings.volume;
  const elSens=document.getElementById('steeringVal');if(elSens)elSens.textContent=sens.toFixed(1)+'x';
  const elTurn=document.getElementById('turnVal');if(elTurn)elTurn.textContent=CFG.LOW_SPEED_TURN.toFixed(1)+' / '+(CFG.MAX_STEER*57.3).toFixed(0)+'°';
  // control type UI
  document.querySelectorAll('[data-ctrl]').forEach(b=>b.classList.toggle('on', b.dataset.ctrl===Settings.controlType));
  const steerWheel=document.getElementById('steerWheel');
  const steerBtns=document.getElementById('steerBtns');
  if(steerWheel)steerWheel.classList.toggle('hidden', Settings.controlType!=='wheel');
  if(steerBtns)steerBtns.classList.toggle('hidden', Settings.controlType!=='buttons');
  document.querySelectorAll('[data-sound]').forEach(b=>b.classList.toggle('on', (b.dataset.sound==='on')===Settings.soundOn));
}

const keys={up:false,down:false,left:false,right:false,space:false};
const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'space'};
window.addEventListener('keydown',e=>{
  const k=keyMap[e.code];if(k){keys[k]=true;e.preventDefault();}
  if(e.code==='KeyL'){jeep.headlights=!jeep.headlights;if(Settings.soundOn)Sfx.tone(jeep.headlights?900:400,0.06,'square',0.07);}
  if(e.code==='KeyP'&&Game.mode==='playing'){Game.paused=!Game.paused;}
  if(e.code==='KeyR'&&Game.mode==='over')startShift();
  if((e.code==='Enter'||e.code==='Space')&&Game.mode==='title')startShift();
  Sfx.init();Sfx.resume();
});
window.addEventListener('keyup',e=>{const k=keyMap[e.code];if(k){keys[k]=false;e.preventDefault();}});

function bindUI(){
  el.banner=document.getElementById('banner');
  el.screen=document.getElementById('screen');
  el.screenBtns=document.getElementById('screenBtns');
  document.getElementById('btnStart').addEventListener('click',startShift);
  const settingsPanel=document.getElementById('settingsPanel');
  const settingsBtn=document.getElementById('settingsBtn');
  const btnSettingsOpen=document.getElementById('btnSettings');
  const btnCloseSettings=document.getElementById('btnCloseSettings');
  const steeringSlider=document.getElementById('steeringSlider');
  const volumeSlider=document.getElementById('volumeSlider');
  loadSettings();
  steeringSlider.value=Settings.steering;
  volumeSlider.value=Settings.volume;
  applySettings();
  function toggleSettings(show){const willShow=show!==undefined?show:settingsPanel.classList.contains('hidden');settingsPanel.classList.toggle('hidden',!willShow);if(willShow)Game.paused=true;else if(Game.mode==='playing')Game.paused=false;}
  settingsBtn.addEventListener('click',()=>toggleSettings());
  btnSettingsOpen.addEventListener('click',()=>{document.getElementById('screen').classList.add('hidden');toggleSettings(true);});
  btnCloseSettings.addEventListener('click',()=>{toggleSettings(false);if(Game.mode!=='playing')document.getElementById('screen').classList.remove('hidden');});
  steeringSlider.addEventListener('input',e=>{Settings.steering=parseFloat(e.target.value);applySettings();saveSettings();});
  volumeSlider.addEventListener('input',e=>{Settings.volume=parseFloat(e.target.value);document.getElementById('volumeVal').textContent=Math.round(Settings.volume*100)+'%';applySettings();saveSettings();});
  document.getElementById('resetSteering').addEventListener('click',()=>{Settings.steering=1.0;steeringSlider.value=1.0;applySettings();saveSettings();});
  document.querySelectorAll('[data-ctrl]').forEach(b=>{b.addEventListener('click',()=>{Settings.controlType=b.dataset.ctrl;applySettings();saveSettings();});});
  document.querySelectorAll('[data-sound]').forEach(b=>{b.addEventListener('click',()=>{Settings.soundOn=b.dataset.sound==='on';applySettings();saveSettings();});});
  initMobileControls();
  initRotateOverlay();
}
function initMobileControls(){
  const mobileEl=document.getElementById('mobileControls');if(!mobileEl)return;
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||window.innerWidth<=900;
  if(isTouch)mobileEl.classList.remove('hidden');
  const btnLeft=document.getElementById('btnLeft');
  const btnRight=document.getElementById('btnRight');
  const btnAccel=document.getElementById('btnAccel');
  const btnBrake=document.getElementById('btnBrake');
  const steerWheel=document.getElementById('steerWheel');
  const steerKnob=document.getElementById('steerKnob');
  function setSteer(v){mobileSteer=clamp(v,-1,1);if(steerKnob){const ang=mobileSteer*75;steerKnob.style.transform=`translateX(-50%) rotate(${ang}deg) translateY(${-mobileSteer*6}px)`;steerWheel.style.transform=`rotate(${-mobileSteer*20}deg)`;}if(btnLeft)btnLeft.classList.toggle('active',mobileSteer<-0.25);if(btnRight)btnRight.classList.toggle('active',mobileSteer>0.25);}
  function setAccel(v){mobileAccel=clamp(v,0,1);if(btnAccel)btnAccel.classList.toggle('active',v>0.1);}
  function setBrake(v){mobileBrake=clamp(v,0,1);if(btnBrake)btnBrake.classList.toggle('active',v>0.1);}
  function bindHold(btn,onDown,onUp){if(!btn)return;const down=(e)=>{e.preventDefault();onDown();};const up=(e)=>{e.preventDefault();onUp();};btn.addEventListener('touchstart',down,{passive:false});btn.addEventListener('touchend',up,{passive:false});btn.addEventListener('touchcancel',up,{passive:false});btn.addEventListener('mousedown',down);btn.addEventListener('mouseup',up);btn.addEventListener('mouseleave',up);}
  bindHold(btnLeft,()=>setSteer(-1),()=>{if(mobileSteer<0)setSteer(0);});
  bindHold(btnRight,()=>setSteer(1),()=>{if(mobileSteer>0)setSteer(0);});
  bindHold(btnAccel,()=>setAccel(1),()=>setAccel(0));
  bindHold(btnBrake,()=>setBrake(1),()=>setBrake(0));
  if(steerWheel){
    let dragging=false;
    function getSteerFromX(clientX){const rect=steerWheel.getBoundingClientRect();const cx=rect.left+rect.width/2;const dx=clientX-cx;return clamp(dx/(rect.width*0.42),-1,1);}
    steerWheel.addEventListener('touchstart',(e)=>{dragging=true;e.preventDefault();const t=e.touches[0];setSteer(getSteerFromX(t.clientX));},{passive:false});
    steerWheel.addEventListener('touchmove',(e)=>{if(!dragging)return;e.preventDefault();const t=e.touches[0];setSteer(getSteerFromX(t.clientX));},{passive:false});
    steerWheel.addEventListener('touchend',(e)=>{dragging=false;e.preventDefault();setSteer(0);},{passive:false});
    steerWheel.addEventListener('mousedown',(e)=>{dragging=true;setSteer(getSteerFromX(e.clientX));});
    window.addEventListener('mousemove',(e)=>{if(dragging)setSteer(getSteerFromX(e.clientX));});
    window.addEventListener('mouseup',()=>{if(dragging){dragging=false;setSteer(0);}});
  }
}
function initRotateOverlay(){
  const overlay=document.getElementById('rotateOverlay');
  if(!overlay)return;
  function check(){
    const isPortrait=window.innerHeight>window.innerWidth && window.innerWidth<900;
    if(isPortrait && Game.mode==='playing') overlay.classList.remove('hidden');
    else overlay.classList.add('hidden');
  }
  window.addEventListener('resize',check);
  window.addEventListener('orientationchange',()=>setTimeout(check,200));
  check();
}

let last=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000||0.016);last=now;
  if(Game.mode==='playing'){update(dt);}
  else{
    Game.t+=dt;
    if(Game.mode==='title'){
      const k=0.5+0.5*Math.sin(Game.t*0.06);
      cam.x=lerp(cam.x,k*Math.max(0,WORLD_W-view.w),0.02);
      cam.y=lerp(cam.y,(0.5+0.5*Math.sin(Game.t*0.041+1))*Math.max(0,WORLD_H-view.h),0.02);
      updateParticles(dt);
      for(const p of poles)p.blink+=dt*3;
      if(Settings.soundOn)Sfx.engine(0,false,false);
    }
  }
  render();
  requestAnimationFrame(frame);
}
function boot(){resize();bindUI();generateWorld(20260915);renderBackground();resetJeep();cam.x=clamp(jeep.x-view.w/2,0,Math.max(0,WORLD_W-view.w));cam.y=clamp(jeep.y-view.h/2,0,Math.max(0,WORLD_H-view.h));requestAnimationFrame(frame);}
boot();
